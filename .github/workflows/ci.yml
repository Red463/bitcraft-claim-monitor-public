name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run application tests
        run: corepack pnpm --filter @workspace/bitcraft-local test
      - name: Build all workspaces
        run: corepack pnpm build
      - name: Test deployment contracts
        run: node --test scripts/test/*.test.mjs
      - name: Validate deployment shell
        run: |
          bash -n deploy/update-bitcraft-claim-monitor-public
          bash -n deploy/backup-bitcraft-claim-monitor-public
      - name: Validate systemd units
        run: |
          sudo install -m 0755 deploy/backup-bitcraft-claim-monitor-public /usr/local/bin/backup-bitcraft-claim-monitor-public
          systemd-analyze verify \
            deploy/bitcraft-claim-monitor-public.service \
            deploy/bitcraft-claim-monitor-public-worker.service \
            deploy/bitcraft-claim-monitor-public-collector.service \
            deploy/bitcraft-claim-monitor-public-collector.timer \
            deploy/bitcraft-claim-monitor-public-backup.service \
            deploy/bitcraft-claim-monitor-public-backup.timer
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=ci@example.invalid \
            -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile
